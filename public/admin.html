<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gida Gida Security Dashboard</title><style>body{font-family:Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0;padding:20px}.wrap{max-width:1050px;margin:auto}.card{background:#fff;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 10px #0001}input,button{padding:11px;border-radius:8px;border:1px solid #ccd3df;font-size:15px}button{background:#9b1c31;color:#fff;border:0;cursor:pointer}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{min-width:150px;background:#fff;padding:15px;border-radius:12px}.stat b{display:block;font-size:25px;color:#9b1c31}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid #edf0f5}th{background:#fafafa}.danger{color:#b42318;font-weight:bold}</style></head><body><div class="wrap"><h1>Gida Gida Security Dashboard</h1><p>Private monitoring for duplicate accounts, referral abuse and suspicious activity.</p><div class="card"><input id="key" type="password" placeholder="Admin dashboard key"><button onclick="load()">Open dashboard</button><span id="msg"></span></div><div id="app"></div></div><script>async function load(){const key=document.getElementById('key').value;const r=await fetch('/api/admin/security',{headers:{'x-admin-key':key}});const d=await r.json();if(!r.ok){document.getElementById('msg').textContent=' Access denied';return}document.getElementById('msg').textContent=' Loaded';document.getElementById('app').innerHTML='<div class="stats"><div class="stat"><b>'+d.totals.total+'</b>Total events</div><div class="stat"><b>'+d.totals.today+'</b>Last 24 hours</div></div><div class="card"><h2>Event summary</h2><table><tr><th>Event</th><th>Count</th></tr>'+d.summary.map(x=>'<tr><td>'+x.event_type+'</td><td>'+x.count+'</td></tr>').join('')+'</table></div><div class="card"><h2>Recent events</h2><table><tr><th>Time</th><th>Event</th><th>Phone</th><th>PVC</th><th>Referral</th></tr>'+d.events.map(x=>'<tr><td>'+new Date(x.created_at).toLocaleString()+'</td><td class="danger">'+x.event_type+'</td><td>'+x.phone+'</td><td>'+x.pvc+'</td><td>'+x.referral_code+'</td></tr>').join('')+'</table></div>'}</script></body></html>
