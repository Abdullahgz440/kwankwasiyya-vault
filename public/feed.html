<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gida Gida Community Feed</title><style>body{font-family:Arial;background:#f5f7fb;color:#172033;margin:0;padding:18px}.wrap{max-width:760px;margin:auto}.brand{color:#9b1c31;font-weight:900;font-size:24px}.post,.admin{background:#fff;border-radius:16px;padding:18px;margin:16px 0;box-shadow:0 2px 10px #0001}.post h2{margin:8px 0}.post p{line-height:1.6;white-space:pre-wrap}.post img{width:100%;max-height:420px;object-fit:cover;border-radius:12px;margin-top:10px}button,input,textarea{font:inherit;padding:10px;border:1px solid #ccd3df;border-radius:8px}button{background:#9b1c31;color:#fff;border:0;cursor:pointer;margin:4px 4px 0 0}.share{background:#1769aa}input,textarea{width:100%;box-sizing:border-box;margin:5px 0}textarea{min-height:100px}.muted{color:#667085;font-size:12px}</style></head><body><div class="wrap"><div class="brand">Gida Gida Community</div><h1>Community Feed</h1><p>Updates and posts for community members.</p><section class="admin"><h2>Admin publishing</h2><input id="key" type="password" placeholder="Admin key"><input id="title" placeholder="Post title"><textarea id="body" placeholder="Write your post"></textarea><input id="image" type="file" accept="image/*"><button onclick="publish()">Publish post</button><span id="msg" class="muted"></span></section><div id="feed">Loading feed…</div></div><script>let posts=[];const esc=x=>String(x).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));async function load(){const r=await fetch('/api/feed');posts=await r.json();feed.innerHTML=posts.length?posts.map(p=>{let u=location.href+'#post-'+p.id;return `<article class="post" id="post-${p.id}"><div class="muted">${new Date(p.created_at).toLocaleString()}</div><h2>${esc(p.title)}</h2><p>${esc(p.body)}</p>${p.image_url?`<img src="${p.image_url}" alt="Community post image">`:''}<br><button class="share" onclick="sharePost(${p.id})">Share</button><button onclick="window.open('https://wa.me/?text='+encodeURIComponent('${esc(p.title)} '+u),'_blank')">WhatsApp</button><button onclick="window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(u),'_blank')">Facebook</button><button onclick="window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent('${esc(p.title)}')+'&url='+encodeURIComponent(u),'_blank')">X</button></article>`}).join(''):'<div class="post">No posts yet.</div>'}async function sharePost(id){let p=posts.find(x=>x.id===id),u=location.href+'#post-'+id;if(navigator.share)try{await navigator.share({title:p.title,text:p.body,url:u})}catch(e){}}async function publish(){let f=new FormData();f.append('title',title.value);f.append('body',body.value);if(image.files[0])f.append('image',image.files[0]);let r=await fetch('/api/admin/posts',{method:'POST',headers:{'x-admin-key':key.value},body:f}),d=await r.json();msg.textContent=r.ok?' Published':' '+(d.error||'Could not publish');if(r.ok){title.value='';body.value='';image.value='';load()}}load();</script></body></html>
